name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teamhub_test
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      TEST_POSTGRESQL_URL: postgresql://postgres:postgres@localhost:5436/teamhub_test
      TEST_REDIS_URL: redis://localhost:6379
      STORAGE_DRIVER: memory
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm --prefix apps/api run lint
      - name: Type check
        run: npm --prefix apps/api run type-check
      - name: Test
        run: npm --prefix apps/api run test
      - name: Build
        run: npm --prefix apps/api run build

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm --prefix apps/web run lint
      - name: Type check
        run: npm --prefix apps/web run type-check
      - name: Test
        run: npm --prefix apps/web run test
      - name: Build
        run: npm --prefix apps/web run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging Compose
        run: docker compose --env-file .env.staging.example -f docker-compose.yml -f docker-compose.staging.yml config
      - name: Build API image
        run: docker build -f apps/api/Dockerfile --target production -t teamhub-api:ci .
      - name: Build migrate image
        run: docker build -f apps/api/Dockerfile --target migrate -t teamhub-migrate:ci .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile --target production -t teamhub-web:ci .
