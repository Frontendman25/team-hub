# ─────────────────────────────────────────────────────────────────────────────
# Base docker-compose — shared service definitions.
# Do NOT use this file directly.
#
# Development (data plane only, ports published on the host):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis minio
#
# Staging-like local stack (one HTTPS-ready origin via Caddy on :8080):
#   docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml up --build
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teamhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-teamhub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - teamhub-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-teamhub} -d ${POSTGRES_DB:-teamhub}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - teamhub-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-teamhub}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-teamhubminio}
    volumes:
      - minio_data:/data
    networks:
      - teamhub-network
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:9000/minio/health/live || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  teamhub-network:
    driver: bridge
