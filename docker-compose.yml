# ─────────────────────────────────────────────────────────────────────────────
# Base docker-compose — shared service definitions.
# Do NOT use this file directly.
#
# Development (data plane only, ports published on the host):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis minio
#
# Staging-like local stack (one HTTPS-ready origin via Caddy on :8080):
#   docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml up --build
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teamhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-teamhub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - teamhub-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-teamhub} -d ${POSTGRES_DB:-teamhub}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - teamhub-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Official minio/minio (Docker Hub) and quay.io/minio/minio are no longer
    # anonymously pullable. Chainguard is still MinIO (S3 API), not a new store.
    # Digest verified 2026-10-30 (image reports RELEASE.2026-10-23T20-06-51Z).
    image: cgr.dev/chainguard/minio@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-teamhub}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-teamhubminio}
    volumes:
      - minio_data:/data
    networks:
      - teamhub-network
    healthcheck:
      # Distroless-style image has bash but not curl.
      test:
        - CMD
        - /usr/bin/bash
        - -c
        - echo >/dev/tcp/127.0.0.1/9000
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  teamhub-network:
    driver: bridge
