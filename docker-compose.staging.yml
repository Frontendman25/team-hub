# Local production-like stack. Does not provision AWS or Vercel.
#
#   Copy .env.staging.example to .env.staging (never commit secrets)
#   docker compose --env-file .env.staging -p teamhub-staging \
#     -f docker-compose.yml -f docker-compose.staging.yml up --build
#
# Postgres, Redis stay on the compose network (not published).
# MinIO API is published on 9002 so browser presigned PUTs work locally.
# Browse http://localhost:8080 after migrate exits 0.
# Optional catalog (idempotent, no persona passwords):
#   docker compose --env-file .env.staging -p teamhub-staging \
#     -f docker-compose.yml -f docker-compose.staging.yml \
#     run --rm --no-deps --entrypoint node api dist/seed-staging-demo.js

name: teamhub-staging

services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teamhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-teamhub_staging}

  redis:
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    ports:
      - '${STAGING_S3_PORT:-9002}:9000'

  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:5b759d9e248ad9f1ab8455f8168b86a47acb1e08207d38603b504bdc5a555d7a
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-teamhub-staging}
    entrypoint:
      - /usr/bin/bash
      - -c
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        mc mb -p "local/$$S3_BUCKET"
    restart: 'no'
    networks:
      - teamhub-network

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    image: teamhub-api:local
    command: ['node', 'dist/migrate.js']
    environment:
      NODE_ENV: production
      POSTGRESQL_URL: ${POSTGRESQL_URL:?POSTGRESQL_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks:
      - teamhub-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    image: teamhub-api:local
    environment:
      NODE_ENV: production
      PORT: 3200
      POSTGRESQL_URL: ${POSTGRESQL_URL:?POSTGRESQL_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SQL_TRACE: 'false'
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
      GUEST_SESSION_HOURS: ${GUEST_SESSION_HOURS:-4}
      ALLOW_DEMO_PERSONA_LOGIN: ${ALLOW_DEMO_PERSONA_LOGIN:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SOCKET_IO_REDIS_REQUIRED: ${SOCKET_IO_REDIS_REQUIRED:-true}
      RUN_BACKGROUND_JOBS: ${RUN_BACKGROUND_JOBS:-true}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1,::1,::ffff:127.0.0.1}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9002}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-teamhub-staging}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3200/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s
    stop_grace_period: 20s
    networks:
      - teamhub-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8080}
    image: teamhub-web:local
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:3200
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8080}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - teamhub-network

  caddy:
    image: caddy:2.9-alpine
    ports:
      - '${STAGING_HTTP_PORT:-8080}:80'
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - teamhub-network

volumes:
  caddy_data:
  caddy_config:
